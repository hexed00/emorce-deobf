<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<meta name="theme-color" content="#c41e3a"/>
<meta name="description" content="DEMORCE Tools — Emorce HEXED + full Lua deobfuscation suite"/>
<title>DEMORCE Tools</title>
<link rel="icon" type="image/png" href="/favicon.png"/>
<link rel="apple-touch-icon" href="/favicon.png"/>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600&family=Outfit:wght@400;500;600;700;800&display=swap" rel="stylesheet"/>
<style>
:root{--bg:#07050a;--bg2:#0e0a10;--panel:rgba(18,12,20,.92);--panel2:rgba(24,16,28,.85);--border:rgba(196,30,58,.22);--border-hot:rgba(196,30,58,.55);--red:#c41e3a;--red2:#e11d48;--red-glow:rgba(196,30,58,.35);--text:#f5f0f2;--muted:rgba(245,240,242,.48);--muted2:rgba(245,240,242,.28);--ok:#34d399;--radius:14px;--font:Outfit,system-ui,sans-serif;--mono:JetBrains Mono,ui-monospace,monospace}
*{box-sizing:border-box;margin:0;padding:0}html,body{height:100%}body{font-family:var(--font);background:var(--bg);color:var(--text);min-height:100vh;overflow-x:hidden}body::before{content:"";position:fixed;inset:0;pointer-events:none;z-index:0;background:radial-gradient(ellipse 70% 45% at 50% -10%,rgba(196,30,58,.2),transparent 55%),radial-gradient(ellipse 40% 30% at 90% 80%,rgba(196,30,58,.06),transparent 50%)}
.splash{position:fixed;inset:0;z-index:200;display:flex;flex-direction:column;align-items:center;justify-content:center;background:radial-gradient(ellipse at center,#140810,#07050a);cursor:pointer;transition:opacity .45s ease,visibility .45s}.splash.out{opacity:0;visibility:hidden;pointer-events:none}.splash .ring{width:88px;height:88px;border-radius:22px;background:linear-gradient(145deg,#1a0a10,#0a0608);border:1px solid var(--border-hot);box-shadow:0 0 48px var(--red-glow),inset 0 0 24px rgba(196,30,58,.15);display:flex;align-items:center;justify-content:center;margin-bottom:22px}.splash .ring img{width:56px;height:56px;object-fit:contain;filter:drop-shadow(0 0 8px var(--red-glow))}.splash h1{font-size:2.6rem;font-weight:800;letter-spacing:-.03em}.splash h1 span{color:var(--red2)}.splash p{margin-top:10px;color:var(--muted);font-size:14px;font-weight:500}.splash .spin{margin-top:28px;width:28px;height:28px;border:2px solid rgba(196,30,58,.25);border-top-color:var(--red2);border-radius:50%;animation:spin .85s linear infinite}@keyframes spin{to{transform:rotate(360deg)}}
.shell{position:relative;z-index:1;min-height:100vh;display:flex;flex-direction:column}.topbar{position:sticky;top:0;z-index:50;display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 18px;background:rgba(7,5,10,.82);border-bottom:1px solid var(--border);backdrop-filter:blur(16px)}.brand{display:flex;align-items:center;gap:10px;text-decoration:none;color:var(--text);font-weight:700;font-size:15px}.brand img{width:32px;height:32px;border-radius:9px;object-fit:cover;box-shadow:0 0 16px var(--red-glow)}.brand em{font-style:normal;color:var(--red2)}.nav-pills{display:flex;gap:4px;flex-wrap:wrap}.nav-pills button{appearance:none;border:none;background:transparent;color:var(--muted);font-family:inherit;font-size:12px;font-weight:600;padding:7px 14px;border-radius:999px;cursor:pointer;transition:color .15s,background .15s}.nav-pills button:hover{color:#fda4af;background:rgba(196,30,58,.1)}.nav-pills button.on{color:#fecdd3;background:rgba(196,30,58,.18)}.status-dot{display:flex;align-items:center;gap:6px;font-size:11px;font-weight:600;color:var(--muted)}.status-dot i{width:7px;height:7px;border-radius:50%;background:var(--ok);box-shadow:0 0 8px rgba(52,211,153,.6)}
.main{flex:1;display:grid;grid-template-columns:260px 1fr;gap:0;max-width:1280px;width:100%;margin:0 auto;min-height:0}@media(max-width:900px){.main{grid-template-columns:1fr}.sidebar{display:none}.sidebar.mobile-open{display:block;position:fixed;inset:56px 0 auto 0;z-index:40;max-height:70vh;overflow:auto;border-bottom:1px solid var(--border)}}
.sidebar{border-right:1px solid var(--border);background:rgba(10,7,12,.75);padding:14px 10px 24px;overflow-y:auto;max-height:calc(100vh - 56px);position:sticky;top:56px}.side-label{font-size:10px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--muted2);padding:10px 10px 6px}.tool{width:100%;display:flex;align-items:center;gap:10px;padding:9px 10px;border-radius:12px;border:1px solid transparent;background:transparent;color:var(--text);cursor:pointer;text-align:left;font-family:inherit;font-size:13px;font-weight:600;transition:background .12s,border-color .12s;margin-bottom:3px}.tool:hover{background:rgba(196,30,58,.08)}.tool.active{background:rgba(196,30,58,.16);border-color:rgba(196,30,58,.4)}.tool .ico{width:34px;height:34px;border-radius:9px;overflow:hidden;flex-shrink:0;background:#0a0608;border:1px solid rgba(196,30,58,.2);display:flex;align-items:center;justify-content:center}.tool .ico img{width:100%;height:100%;object-fit:cover}.tool .meta{flex:1;min-width:0}.tool .meta span{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.tool .meta small{display:block;font-size:10px;font-weight:500;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:1px}.badge{font-size:9px;font-weight:700;letter-spacing:.04em;padding:2px 6px;border-radius:999px;background:rgba(196,30,58,.28);color:#fda4af;margin-left:4px;vertical-align:middle}.badge.native{background:rgba(52,211,153,.2);color:#6ee7b7}.badge.beta{background:rgba(251,191,36,.18);color:#fcd34d}
.workspace{padding:20px 20px 48px;min-width:0}.panel{background:var(--panel);border:1px solid var(--border);border-radius:var(--radius);padding:20px;box-shadow:0 8px 40px rgba(0,0,0,.35)}.panel-head{display:flex;align-items:center;gap:14px;margin-bottom:16px;flex-wrap:wrap}.panel-head .ph-ico{width:52px;height:52px;border-radius:14px;overflow:hidden;border:1px solid var(--border-hot);box-shadow:0 0 24px var(--red-glow);background:#0a0608}.panel-head .ph-ico img{width:100%;height:100%;object-fit:cover}.panel-head h2{font-size:1.35rem;font-weight:800;letter-spacing:-.02em}.panel-head p{font-size:13px;color:var(--muted);margin-top:3px;max-width:520px}textarea{width:100%;min-height:240px;font-family:var(--mono);font-size:12.5px;line-height:1.55;background:rgba(0,0,0,.45);border:1px solid rgba(196,30,58,.2);border-radius:12px;color:var(--text);padding:14px 16px;resize:vertical;outline:none;transition:border-color .15s}textarea:focus{border-color:var(--border-hot)}textarea::placeholder{color:var(--muted2)}.toolbar{display:flex;flex-wrap:wrap;align-items:center;gap:10px;margin:14px 0 0}.btn{appearance:none;border:none;cursor:pointer;font-family:inherit;font-weight:700;font-size:13px;padding:11px 20px;border-radius:999px;background:linear-gradient(135deg,var(--red2),#9f1239);color:#fff;box-shadow:0 0 28px var(--red-glow);transition:transform .12s,opacity .12s,filter .12s}.btn:hover{filter:brightness(1.08)}.btn:active{transform:scale(.98)}.btn:disabled{opacity:.45;cursor:not-allowed;filter:none}.btn.ghost{background:transparent;border:1px solid rgba(196,30,58,.4);color:#fda4af;box-shadow:none}.check{display:flex;align-items:center;gap:8px;font-size:12.5px;font-weight:500;color:var(--muted);margin-right:4px}.check input{accent-color:var(--red2);width:15px;height:15px}.out{margin-top:16px}.out .err{color:#f87171;font-size:13px;font-weight:600;margin-bottom:8px}.out .hint{color:var(--muted);font-size:12px;margin-bottom:8px}.out pre{font-family:var(--mono);font-size:12px;line-height:1.5;background:rgba(0,0,0,.5);border:1px solid rgba(196,30,58,.18);border-radius:12px;padding:14px 16px;white-space:pre-wrap;word-break:break-word;max-height:420px;overflow:auto;color:#e7e5e4}.paste-card{background:rgba(196,30,58,.08);border:1px solid rgba(196,30,58,.25);border-radius:12px;padding:12px 14px;margin-bottom:12px}.paste-card a{color:#fda4af;font-weight:600;text-decoration:none}.paste-card a:hover{text-decoration:underline}
.home{max-width:720px;margin:0 auto;text-align:center;padding-top:24px}.home .logo{width:76px;height:76px;border-radius:20px;object-fit:cover;box-shadow:0 0 40px var(--red-glow);margin-bottom:18px;border:1px solid var(--border-hot)}.home h1{font-size:2.4rem;font-weight:800;letter-spacing:-.03em}.home h1 span{color:var(--red2)}.home .lead{color:var(--muted);font-size:15px;margin:12px 0 28px;line-height:1.5}.cards{display:grid;grid-template-columns:1fr 1fr;gap:12px;text-align:left}@media(max-width:640px){.cards{grid-template-columns:1fr}}.card{display:flex;gap:12px;align-items:flex-start;background:var(--panel2);border:1px solid var(--border);border-radius:14px;padding:14px 16px;cursor:pointer;transition:border-color .15s,background .15s}.card:hover{border-color:var(--border-hot);background:rgba(196,30,58,.08)}.card .cico{width:40px;height:40px;border-radius:10px;overflow:hidden;flex-shrink:0;border:1px solid rgba(196,30,58,.25);background:#0a0608}.card .cico img{width:100%;height:100%;object-fit:cover}.card strong{font-size:14px;display:block}.card span{font-size:12px;color:var(--muted);margin-top:3px;display:block}.footer-note{margin-top:28px;font-size:11px;color:var(--muted2)}.mob-tools{display:none;margin-bottom:12px}@media(max-width:900px){.mob-tools{display:block}.mob-tools button{width:100%;padding:10px;border-radius:12px;border:1px solid var(--border);background:var(--panel);color:var(--text);font-family:inherit;font-weight:600;font-size:13px;cursor:pointer}}.api-list code{font-family:var(--mono);font-size:12px;color:#fda4af;background:rgba(0,0,0,.35);padding:2px 8px;border-radius:6px}.api-row{background:var(--panel);border:1px solid var(--border);border-radius:12px;padding:12px 14px;margin-bottom:8px;font-size:13px}
</style>
</head>
<body>
<div class="splash" id="splash">
  <div class="ring"><img src="/emorce.png" alt="DEMORCE"/></div>
  <h1>DEMORCE <span>Tools</span></h1>
  <p>click anywhere to enter</p>
  <div class="spin"></div>
</div>
<div class="shell hidden" id="shell" style="display:none">
  <header class="topbar">
    <a class="brand" href="#home"><img src="/favicon.png" alt=""/>DEMORCE <em>Tools</em></a>
    <nav class="nav-pills">
      <button type="button" data-page="home" class="on">Home</button>
      <button type="button" data-page="tool">Engines</button>
      <button type="button" data-page="api">API</button>
      <button type="button" data-page="updates">Updates</button>
    </nav>
    <div class="status-dot"><i></i> engines live</div>
  </header>
  <div class="main">
    <aside class="sidebar" id="sidebar">
      <div class="side-label">Native</div>
      <div id="side-native"></div>
      <div class="side-label">Deobfuscators</div>
      <div id="side-deobf"></div>
      <div class="side-label">Utilities</div>
      <div id="side-util"></div>
    </aside>
    <section class="workspace" id="workspace"></section>
  </div>
</div>
<script>
const TOOLS=[
{id:'hexed',name:'HEXED v4',img:'/emorce.png',endpoint:'/api/hexed',local:true,group:'native',label:'OBFUSCATE',desc:'Emorce multi-key obfuscator. Nibble keys, XOR index, triple integrity, anti-hook.',badge:'NATIVE',badgeClass:'native'},
{id:'detector',name:'Detector',img:'/icons/detector.png',endpoint:'/detect',group:'deobf',label:'DETECT',desc:'Identify which obfuscator was used on a script.'},
{id:'luraph',name:'Luraph',img:'/icons/luraph.png',endpoint:'/luraph',group:'deobf',label:'DEOBFUSCATE',desc:'Luraph v14 through v15.1 — full family.',badge:'v14–15.1'},
{id:'prometheus',name:'Prometheus',img:'/icons/prometheus.png',endpoint:'/prometheus',group:'deobf',label:'DEOBFUSCATE',desc:'Prometheus / WeAreDevs style dumps.'},
{id:'moonsec',name:'MoonSec',img:'/icons/moonsecv3.png',endpoint:'/moonsec',group:'deobf',label:'DEOBFUSCATE',desc:'MoonSec V2 / V3 recovery.'},
{id:'ironveil',name:'Ironveil',img:'/icons/ironveil.png',endpoint:'/ironveil',group:'deobf',label:'DEOBFUSCATE',desc:'Ironveil Deobfuscator V1 family.'},
{id:'psu',name:'PSU',img:'/icons/psu.png',endpoint:'/psu',group:'deobf',label:'DEOBFUSCATE',desc:'PSU 4.x family.'},
{id:'ironbrew2',name:'IronBrew2',img:'/icons/ironbrew2.gif',endpoint:'/ironbrew2',group:'deobf',label:'DEOBFUSCATE',desc:'IronBrew2 deobfuscator.'},
{id:'moonveil',name:'Moonveil',img:'/icons/moonveil.webp',endpoint:'/moonveil',group:'deobf',label:'DEOBFUSCATE',desc:'Moonveil protected scripts.'},
{id:'xhider',name:'XHider',img:'/icons/xhider.gif',endpoint:'/xhider',group:'deobf',label:'DEOBFUSCATE',desc:'XHider deobfuscator.'},
{id:'hercules',name:'Hercules',img:'/icons/hercules.png',endpoint:'/hercules',group:'deobf',label:'DEOBFUSCATE',desc:'Hercules only.'},
{id:'goofyscator',name:'Goofyscator',img:'/icons/goofyscator.webp',endpoint:'/goofyscator',group:'deobf',label:'DEOBFUSCATE',desc:'Goofyscator V10.',badge:'BETA',badgeClass:'beta'},
{id:'clyde',name:'Clyde',img:'/icons/clyde.png',endpoint:'/clydedeobf',group:'deobf',label:'DEOBFUSCATE',desc:'Clyde Protection.'},
{id:'77fuscator',name:'77fuscator',img:'/icons/77fuscator.png',endpoint:'/77fuscator',group:'deobf',label:'DEOBFUSCATE',desc:'77fuscator only.'},
{id:'luaobfuscator',name:'LuaObfuscator',img:'/icons/luaobfuscator.png',endpoint:'/luaobfuscator',group:'deobf',label:'DEOBFUSCATE',desc:'LuaObfuscator.com dumps.'},
{id:'obfuscator',name:'Obfuscator',img:'/icons/obfuscator.png',endpoint:'/obfuscate',group:'util',label:'OBFUSCATE',desc:'LeakD-style plain Lua obfuscator.'},
{id:'beautifier',name:'Beautifier',img:'/icons/beautifier.png',endpoint:'/beautify',group:'util',label:'BEAUTIFY',desc:'Beautify / format any Lua script.'},
{id:'renamer',name:'Renamer',img:'/icons/renamer.gif',endpoint:'/rename',group:'util',label:'RENAME',desc:'Rename and clean identifiers.'}
];
let activeId='hexed',scriptBuf='',page='home';
const splash=document.getElementById('splash'),shell=document.getElementById('shell'),workspace=document.getElementById('workspace'),sidebar=document.getElementById('sidebar');
function enter(){sessionStorage.setItem('demorce_in','1');splash.classList.add('out');shell.style.display='flex';route()}splash.onclick=enter;if(sessionStorage.getItem('demorce_in'))enter();
function esc(s){return String(s).replace(/&/g,'&').replace(/</g,'<').replace(/>/g,'>').replace(/"/g,'"')}
function toolBtn(t){const badge=t.badge?`<span class="badge ${t.badgeClass||''}">${esc(t.badge)}</span>`:'';return `<button type="button" class="tool ${t.id===activeId?'active':''}" data-id="${t.id}"><span class="ico"><img src="${t.img}" alt=""/></span><span class="meta"><span>${esc(t.name)}${badge}</span><small>${esc(t.desc)}</small></span></button>`}
function renderSidebar(){document.getElementById('side-native').innerHTML=TOOLS.filter(t=>t.group==='native').map(toolBtn).join('');document.getElementById('side-deobf').innerHTML=TOOLS.filter(t=>t.group==='deobf').map(toolBtn).join('');document.getElementById('side-util').innerHTML=TOOLS.filter(t=>t.group==='util').map(toolBtn).join('');sidebar.querySelectorAll('.tool').forEach(b=>{b.onclick=()=>{activeId=b.dataset.id;page='tool';document.querySelectorAll('.nav-pills button').forEach(x=>x.classList.toggle('on',x.dataset.page==='tool'));sidebar.classList.remove('mobile-open');route()}})}
function route(){renderSidebar();if(page==='tool')renderTool();else if(page==='api')renderApi();else if(page==='updates')renderUpdates();else renderHome()}
document.querySelectorAll('.nav-pills button').forEach(btn=>{btn.onclick=()=>{page=btn.dataset.page;document.querySelectorAll('.nav-pills button').forEach(x=>x.classList.toggle('on',x===btn));route()}});
function renderHome(){workspace.innerHTML=`<div class="home"><img class="logo" src="/emorce.png" alt="DEMORCE"/><h1>DEMORCE <span>Tools</span></h1><p class="lead">Native HEXED v4 obfuscation. Luraph 14–15.1, Prometheus, Ironveil, MoonSec and the full engine set — keyed, faster, cleaner than the public board.</p><div class="cards"><div class="card" data-go="hexed"><div class="cico"><img src="/emorce.png"/></div><div><strong>HEXED v4</strong><span>Paid-tier anti-static obfuscator. Ours.</span></div></div><div class="card" data-go="luraph"><div class="cico"><img src="/icons/luraph.png"/></div><div><strong>Luraph 14–15.1</strong><span>Full version range, one click.</span></div></div><div class="card" data-go="ironveil"><div class="cico"><img src="/icons/ironveil.png"/></div><div><strong>Ironveil</strong><span>V1 family recovery.</span></div></div><div class="card" data-go="detector"><div class="cico"><img src="/icons/detector.png"/></div><div><strong>Detector</strong><span>Find the right engine first.</span></div></div></div><p class="footer-note">DEMORCE · Emorce stack</p></div>`;workspace.querySelectorAll('.card').forEach(c=>{c.onclick=()=>{activeId=c.dataset.go;page='tool';document.querySelectorAll('.nav-pills button').forEach(x=>x.classList.toggle('on',x.dataset.page==='tool'));route()}})}
function renderTool(){const t=TOOLS.find(x=>x.id===activeId)||TOOLS[0];const badge=t.badge?`<span class="badge ${t.badgeClass||''}">${esc(t.badge)}</span>`:'';workspace.innerHTML=`<div class="mob-tools"><button type="button" id="mob-toggle">☰ Engines</button></div><div class="panel"><div class="panel-head"><div class="ph-ico"><img src="${t.img}" alt=""/></div><div><h2>${esc(t.name)} ${badge}</h2><p>${esc(t.desc)}</p></div></div><textarea id="script" placeholder="Paste Lua / Luau here…">${esc(scriptBuf)}</textarea><div class="toolbar"><label class="check"><input type="checkbox" id="pastefy"/> Pastefy upload</label><button class="btn" id="run">${esc(t.label)}</button><button class="btn ghost" id="clear">Clear</button><button class="btn ghost" id="copy" style="display:none">Copy result</button></div><div class="out" id="out"></div></div>`;const mob=document.getElementById('mob-toggle');if(mob)mob.onclick=()=>sidebar.classList.toggle('mobile-open');document.getElementById('clear').onclick=()=>{scriptBuf='';document.getElementById('script').value='';document.getElementById('out').innerHTML=''};document.getElementById('run').onclick=()=>runTool(t)}
async function runTool(t){const ta=document.getElementById('script');scriptBuf=ta?ta.value:'';const out=document.getElementById('out');const btn=document.getElementById('run');const copyBtn=document.getElementById('copy');const wantPaste=document.getElementById('pastefy')?.checked;if(!scriptBuf.trim()){out.innerHTML='<p class="err">Paste a script first.</p>';return}btn.disabled=true;btn.textContent='Working…';out.innerHTML='<p class="hint">Running engine…</p>';if(copyBtn)copyBtn.style.display='none';try{const fd=new FormData();fd.append('script',scriptBuf);fd.append('file',new Blob([scriptBuf],{type:'text/plain'}),'script.lua');if(wantPaste)fd.append('pastefy','true');const url=t.local?'/api/hexed':'/api/proxy?path='+encodeURIComponent(t.endpoint);const headers=wantPaste?{'X-Pastefy':'1'}:{};const res=await fetch(url,{method:'POST',body:fd,headers});const text=await res.text();let data;try{data=JSON.parse(text)}catch{data={raw:text}}let result='',isErr=false;if(typeof data.code==='string')result=data.code;else if(typeof data.obfuscated_code==='string')result=data.obfuscated_code;else if(typeof data.result==='string')result=data.result;else if(typeof data.output==='string')result=data.output;else if(data.error){isErr=true;result=String(data.error);if(/retarded|not the right obfuscator/i.test(result))result='Wrong obfuscator (or not a matching dump).\n\n→ Run Detector first\n→ Or use Beautifier / HEXED on plain Lua\n\n'+result}else if(data.top_result||data.detections)result=JSON.stringify(data,null,2);else if(data.raw)result=data.raw;else result=JSON.stringify(data,null,2);let extra='';if(data.pastefy&&data.pastefy.url){extra='<div class="paste-card"><strong style="color:#fda4af">Pastefy</strong><br/><a href="'+esc(data.pastefy.url)+'" target="_blank" rel="noopener">'+esc(data.pastefy.url)+'</a>'+(data.pastefy.raw?' · <a href="'+esc(data.pastefy.raw)+'" target="_blank" rel="noopener">raw</a>':'')+'</div>'}if(data.build)extra+='<p class="hint">build '+esc(data.build)+'</p>';out.innerHTML=extra+(isErr?'<p class="err">Engine rejected this input</p>':'')+'<pre id="result-pre">'+esc(result)+'</pre>';if(copyBtn&&result&&!isErr){copyBtn.style.display='';copyBtn.onclick=async()=>{try{await navigator.clipboard.writeText(result);copyBtn.textContent='Copied';setTimeout(()=>copyBtn.textContent='Copy result',1200)}catch(_){}}}}catch(e){out.innerHTML='<p class="err">Request failed: '+esc(e.message)+'</p>'}btn.disabled=false;btn.textContent=t.label}
function renderApi(){workspace.innerHTML='<div class="panel api-list"><h2 style="margin-bottom:8px">API</h2><p style="color:var(--muted);font-size:13px;margin-bottom:16px">HEXED is native. Everything else proxies LeakD engines with the DEMORCE key.</p>'+TOOLS.map(t=>`<div class="api-row"><code>POST ${t.local?'/api/hexed':'/api/proxy?path='+t.endpoint}</code> — ${esc(t.name)}</div>`).join('')+'<div class="api-row" style="margin-top:12px"><strong>Body</strong><br/><span style="color:var(--muted);font-size:12px">multipart <code>script</code> / <code>file</code>, or raw text / JSON. Optional Pastefy via <code>pastefy=true</code> or <code>X-Pastefy: 1</code>.</span></div></div>'}
function renderUpdates(){workspace.innerHTML=`<div class="panel"><h2 style="margin-bottom:12px">Updates</h2><div style="margin-bottom:16px"><strong style="color:#fda4af">v6 — DEMORCE menu</strong><p style="color:var(--muted);font-size:13px;margin-top:6px;line-height:1.5">Full redesign: sticky top bar, grouped engine sidebar, real icons, detector-first flow, copy-result, Pastefy. LeakD API key wired server-side. Luraph 14–15.1, Ironveil, Prometheus, MoonSec — cleaner than public LeakD.</p></div><div><strong style="color:#fda4af">HEXED v4</strong><p style="color:var(--muted);font-size:13px;margin-top:6px;line-height:1.5">Nibble-masked keys, XOR index, runtime stream seed, multi-key + LCG, heavy decoys, triple integrity, anti-hook loader. Optional Pastefy.</p></div></div>`}
</script>
</body>
</html>
